[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expenses-bot"
version = "0.1.0"
description = "Telegram bot that parses bank statements and appends expenses to Google Sheets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13",
  "chardet>=5.2",
  "google-auth>=2.35",
  "google-auth-oauthlib>=1.2",
  "gspread>=6.1",
  "pdfplumber>=0.11",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[project.scripts]
expenses-bot = "expenses_bot.bot:main"
expenses-bot-oauth = "expenses_bot.oauth_setup:main"

[tool.setuptools.packages.find]
include = ["expenses_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
